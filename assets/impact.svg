<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="t d">
  <title id="t">Impact in numbers</title>
  <desc id="d">98 to 99 percent wound segmentation accuracy on 3,000+ clinical images; up to 2.4 times better reward than DQN, D3QN and QCOMBO in multi-agent RL; RAG over 16 textbooks and papers; 6.4 million trajectory samples; plus or minus 1 to 2 percent flow accuracy with 24x7 uptime; up to 40 percent less power wastage.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12101f"/>
      <stop offset="1" stop-color="#0b1216"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ff0c4"/><stop offset="1" stop-color="#2CB67D"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9ceff"/><stop offset="1" stop-color="#9b7dff"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe0a3"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .num  { font-size: 52px; font-weight: 800; }
    .lab  { font-size: 19px; font-weight: 600; fill: #e6e9f5; }
    .sub  { font-size: 14px; fill: #7c86ad; letter-spacing: .5px; }
    .c    { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .bar  { transform-origin: left center; transform-box: fill-box; transform: scaleX(0); animation: grow 1s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .c { animation: none; opacity: 1; }
      .bar { animation: none; transform: none; }
    }
  </style>

  <!-- row 1 -->
  <g class="c" style="animation-delay:.05s">
    <rect x="1" y="1" width="384" height="164" rx="14" fill="url(#card)" stroke="#2CB67D" stroke-opacity="0.35"/>
    <rect class="bar" style="animation-delay:.35s" x="26" y="24" width="56" height="4" rx="2" fill="url(#g1)"/>
    <text class="sans num" x="26" y="88" fill="url(#g1)">98–99%</text>
    <text class="sans lab" x="26" y="120">segmentation accuracy</text>
    <text class="mono sub" x="26" y="144">wound analysis · 3,000+ clinical images</text>
  </g>
  <g class="c" style="animation-delay:.15s">
    <rect x="408" y="1" width="384" height="164" rx="14" fill="url(#card)" stroke="#9b7dff" stroke-opacity="0.35"/>
    <rect class="bar" style="animation-delay:.45s" x="433" y="24" width="56" height="4" rx="2" fill="url(#g2)"/>
    <text class="sans num" x="433" y="88" fill="url(#g2)">2.4×</text>
    <text class="sans lab" x="433" y="120">reward vs DQN / D3QN / QCOMBO</text>
    <text class="mono sub" x="433" y="144">best case · MQLC scored 120.41</text>
  </g>
  <g class="c" style="animation-delay:.25s">
    <rect x="815" y="1" width="384" height="164" rx="14" fill="url(#card)" stroke="#f59e0b" stroke-opacity="0.35"/>
    <rect class="bar" style="animation-delay:.55s" x="840" y="24" width="56" height="4" rx="2" fill="url(#g3)"/>
    <text class="sans num" x="840" y="88" fill="url(#g3)">16</text>
    <text class="sans lab" x="840" y="120">textbooks &amp; papers behind the RAG</text>
    <text class="mono sub" x="840" y="144">NPWT clinical decision support</text>
  </g>

  <!-- row 2 -->
  <g class="c" style="animation-delay:.35s">
    <rect x="1" y="185" width="384" height="164" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.35"/>
    <rect class="bar" style="animation-delay:.65s" x="26" y="208" width="56" height="4" rx="2" fill="url(#g4)"/>
    <text class="sans num" x="26" y="272" fill="url(#g4)">6.4M</text>
    <text class="sans lab" x="26" y="304">trajectory samples</text>
    <text class="mono sub" x="26" y="328">NGSIM · 3 s history → 5 s future</text>
  </g>
  <g class="c" style="animation-delay:.45s">
    <rect x="408" y="185" width="384" height="164" rx="14" fill="url(#card)" stroke="#f472b6" stroke-opacity="0.35"/>
    <rect class="bar" style="animation-delay:.75s" x="433" y="208" width="56" height="4" rx="2" fill="url(#g5)"/>
    <text class="sans num" x="433" y="272" fill="url(#g5)">±1–2%</text>
    <text class="sans lab" x="433" y="304">flow accuracy, 1–30 L/min</text>
    <text class="mono sub" x="433" y="328">ESP32 flow monitor · 24×7 uptime</text>
  </g>
  <g class="c" style="animation-delay:.55s">
    <rect x="815" y="185" width="384" height="164" rx="14" fill="url(#card)" stroke="#2CB67D" stroke-opacity="0.35"/>
    <rect class="bar" style="animation-delay:.85s" x="840" y="208" width="56" height="4" rx="2" fill="url(#g1)"/>
    <text class="sans num" x="840" y="272" fill="url(#g1)">40%</text>
    <text class="sans lab" x="840" y="304">less power wastage (up to)</text>
    <text class="mono sub" x="840" y="328">smart campus automation · 1st prize</text>
  </g>
</svg>
