<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Muhammed Arshad P K — Computer Vision &amp; AI Engineer, ML Researcher</title>
  <desc id="d">Banner with two neural networks whose signals flow inward toward the name. Focus areas: computer vision, medical AI, multi-agent RL, RAG and LLMs, edge and IoT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090a13"/>
      <stop offset="0.55" stop-color="#130f29"/>
      <stop offset="1" stop-color="#0a1517"/>
    </linearGradient>
    <radialGradient id="glowP">
      <stop offset="0" stop-color="#7F5AF0" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#7F5AF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT">
      <stop offset="0" stop-color="#2CB67D" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2CB67D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdbdff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ff0c4"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b7dff"/>
      <stop offset="1" stop-color="#2CB67D"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b7cf6" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .glow  { animation: pulse 8s ease-in-out infinite; }
    .glow2 { animation: pulse 8s ease-in-out -4s infinite; }
    .sig   { stroke-dasharray: 10 400; stroke-dashoffset: 10; animation: travel 3s linear infinite; }
    .node  { animation: beat 4s ease-in-out infinite; }
    .pop   { opacity: 0; animation: pop .7s ease-out forwards; }
    .rule  { transform-origin: center; transform-box: fill-box; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.7,.2,1) 1s forwards; }
    @keyframes pulse  { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    @keyframes travel { to { stroke-dashoffset: -400; } }
    @keyframes beat   { 0%, 100% { fill-opacity: .45; } 50% { fill-opacity: 1; } }
    @keyframes pop    { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow   { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .glow, .glow2, .node { animation: none; }
      .sig { animation: none; opacity: 0; }
      .pop { animation: none; opacity: 1; }
      .rule { animation: none; transform: none; }
    }
  </style>

